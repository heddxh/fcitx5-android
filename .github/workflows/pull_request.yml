name: Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      # pull request's head branch was updated
      - synchronize

jobs:
  generate_mozc_ut_data:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch Mozc sources
        run: |
          git submodule update --init --recursive --checkout plugin/mozc/src/main/cpp/fcitx5-mozc

      - name: Setup Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Generate Mozc UT data
        run: .github/mozc-ut/build-data.sh

      - name: Upload Mozc UT data
        uses: actions/upload-artifact@v7
        with:
          name: mozc-ut-data
          path: |
            plugin/mozc/build/mozc/mozc_data.inc
            plugin/mozc/build/mozc/mozc.data
            plugin/mozc/build/mozc/mozc-ut-data.txt

  build_pull_request:
    needs: generate_mozc_ut_data
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch Mozc sources
        run: |
          git submodule update --init --recursive --checkout plugin/mozc/src/main/cpp/fcitx5-mozc

      - name: Download Mozc UT data
        uses: actions/download-artifact@v7
        with:
          name: mozc-ut-data
          path: plugin/mozc/build/mozc

      - name: Configure Mozc UT data checksum
        shell: bash
        run: |
          echo "MOZC_DATA_SHA256=$(sha256sum plugin/mozc/build/mozc/mozc_data.inc | cut -d' ' -f1)" >> "${GITHUB_ENV}"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android environment
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "cmake;3.31.6"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install extra-cmake-modules gettext

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease
          ./gradlew :assembleReleasePlugins

      - name: Report Mozc UT sizes
        shell: bash
        run: |
          mkdir -p plugin/mozc/build/reports
          {
            cat plugin/mozc/build/mozc/mozc-ut-data.txt
            find plugin/mozc/build/outputs/apk/release -type f -name '*.apk' \
              -printf 'apk_bytes=%s apk=%f\n'
            for apk in plugin/mozc/build/outputs/apk/release/*.apk; do
              unzip -l "${apk}" | awk -v apk="$(basename "${apk}")" \
                '/libmozc\.so$/ { print "libmozc_uncompressed_bytes=" $1 " apk=" apk " path=" $4 }'
            done
          } | tee plugin/mozc/build/reports/mozc-ut-sizes.txt

      - name: Upload Mozc UT report
        uses: actions/upload-artifact@v7
        with:
          name: mozc-ut-report
          path: plugin/mozc/build/reports/mozc-ut-sizes.txt

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: app-ubuntu
          path: app/build/outputs/apk/release/

      - name: Pack plugins
        shell: bash
        run: |
          mkdir plugins-to-upload
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}" ]
            then
              mv "plugin/${i}/build/outputs/apk/release" "plugins-to-upload/${i}"
            fi
          done

      - name: Upload plugins
        uses: actions/upload-artifact@v7
        with:
          name: plugins-ubuntu
          path: plugins-to-upload
